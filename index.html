<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>راوتر قياس سرعة الإنترنت</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="router-box">
    <header class="router-header">
      <h1>جهاز قياس سرعة الإنترنت</h1>
      <div class="status-led" id="led" title="حالة الاتصال"></div>
    </header>

    <section class="router-screen">
      <div class="screen-row">
        <span>التحميل:</span>
        <span id="download">--</span>
        <span class="unit">Mbps</span>
      </div>
      <div class="screen-row">
        <span>الرفع:</span>
        <span id="upload-final">--</span>
        <span class="unit">Mbps</span>
      </div>
      <div class="screen-row">
        <span>الجودة:</span>
        <span id="quality">--</span>
      </div>
    </section>

    <section class="router-info">
      <p>الوقت الحالي: <span id="current-time">--:--</span></p>
      <p>المنطقة الزمنية: <span id="timezone">--</span></p>
    </section>

    <section class="router-chart">
      <h2>اختبار السرعة الحقيقي</h2>
      <iframe src="https://openspeedtest.com/speedtest" width="100%" height="400" frameborder="0" style="border-radius: 12px; overflow: hidden;"></iframe>
    </section>

    <footer class="router-footer">
      <p>© تصميم يحاكي الراوتر | عصام</p>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
