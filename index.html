<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>Speedometer Test</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1 class="title">اختبار سرعة التحميل والرفع</h1>

        <!-- عداد السرعة -->
        <div class="speedometer">
            <div class="dial"></div>
            <div class="needle" id="needle"></div>
            <div class="center-cap"></div>
            <div class="speed-display" id="speedValue">0 Mbps</div>
        </div>

        <!-- زر إعادة الاختبار (أيقونة فقط) -->
        <button class="restart-btn" onclick="restartTest()">
            🔄
        </button>

    </div>

    <script src="script.js"></script>
</body>
</html>
