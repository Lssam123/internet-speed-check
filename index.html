<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>اختبار سرعة الإنترنت</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>اختبار سرعة الإنترنت</h1>
    <div class="meter">
      <div class="circle">
        <span id="status">اضغط لبدء الاختبار</span>
      </div>
    </div>
    <button onclick="ابدأ_الاختبار()">ابدأ الاختبار</button>
    <div class="results">
      <p>📥 سرعة التحميل: <span id="download">--</span> ميجابت/ثانية</p>
      <p>📤 سرعة الرفع: <span id="upload">--</span> ميجابت/ثانية</p>
    </div>
    <canvas id="الرسم_البياني"></canvas>
    <div class="future">
      <h2>ميزات مستقبلية (غير مفعّلة)</h2>
      <ul>
        <li>🔗 مشاركة النتائج عبر رابط</li>
        <li>📍 تحديد الموقع ومزود الخدمة تلقائيًا</li>
        <li>📁 تصدير النتائج بصيغة PDF أو CSV</li>
      </ul>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
