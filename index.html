<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>اختبار الشبكة — نسخة 3.0</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>اختبار الشبكة — Network Test 3.0</header>

<div class="container">

    <!-- IP -->
    <div class="card">
        <h3>عنوان الـ IP</h3>
        <button onclick="getIP()">عرض الـ IP</button>
        <p id="ip" class="output"></p>
    </div>

    <!-- Download -->
    <div class="card">
        <h3>اختبار سرعة التحميل</h3>
        <button onclick="testDownloadSpeed()">ابدأ الاختبار</button>
        <p id="download" class="output"></p>
    </div>

    <!-- Upload -->
    <div class="card">
        <h3>اختبار سرعة الرفع</h3>
        <button onclick="testUploadSpeed()">ابدأ الاختبار</button>
        <p id="upload" class="output"></p>
    </div>

    <!-- Ping -->
    <div class="card">
        <h3>اختبار Ping</h3>
        <button onclick="testPing()">ابدأ الاختبار</button>
        <p id="ping" class="output"></p>
    </div>

    <!-- Jitter -->
    <div class="card">
        <h3>اختبار Jitter</h3>
        <button onclick="testJitter()">ابدأ الاختبار</button>
        <p id="jitter" class="output"></p>
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
