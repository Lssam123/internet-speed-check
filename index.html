<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="اختبار سرعة الإنترنت الحقيقي - قياس فعلي للتحميل بدقة عالية" />
  <title>اختبار سرعة الإنترنت</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <!-- رأس الصفحة -->
    <header class="header fade-in">
      <h1>اختبار سرعة الإنترنت</h1>
      <p class="subtitle">قياس فعلي للسرعة بدون مؤثرات وهمية</p>
    </header>

    <!-- أزرار التحكم -->
    <section class="actions fade-in">
      <div class="button-group">
        <button class="btn primary" onclick="ابدأ_الاختبار()">بدء الاختبار</button>
        <button class="btn secondary" onclick="إعادة_الاختبار()">إعادة الاختبار</button>
      </div>
    </section>

    <!-- النتائج -->
    <section class="results fade-in">
      <div class="result-box">
        <span class="label">سرعة التحميل:</span>
        <span id="download">--</span>
        <span class="unit">ميجابت/ثانية</span>
      </div>
      <div class="result-box">
        <span class="label">سرعة الرفع:</span>
        <span id="upload-final">--</span>
        <span class="unit">ميجابت/ثانية</span>
      </div>
      <div class="quality-box">
        <span id="quality">جودة الاتصال: --</span>
      </div>
    </section>

    <!-- معلومات الاتصال -->
    <section class="connection-info fade-in">
      <p>نوع الاتصال: <span id="connection-type">--</span></p>
      <p>الوقت الحالي: <span id="current-time">--:--</span></p>
      <p>المنطقة الزمنية: <span id="timezone">--</span></p>
      <p>مزود الخدمة: <span id="isp">--</span></p>
      <p>التاريخ: <span id="year">2026</span></p>
    </section>

    <!-- الرسم البياني -->
    <section class="chart-section fade-in">
      <h2>تطور السرعة أثناء الاختبار</h2>
      <canvas id="speedChart" width="100%" height="300"></canvas>
    </section>

    <!-- نسخ ومشاركة -->
    <section class="actions fade-in">
      <div class="button-group">
        <button class="btn copy" onclick="نسخ_النتيجة()">نسخ النتيجة</button>
        <button class="btn share" onclick="مشاركة_النتيجة()">مشاركة النتيجة</button>
      </div>
    </section>

    <!-- التذييل -->
    <footer class="footer fade-in">
      <p>متدربين كلية العيدابي © 2026</p>
    </footer>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="script.js"></script>
</body>
</html>
