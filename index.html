<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>Network Security & Topology Simulator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>محاكي الشبكات والأمان</h1>

    <div class="container">

        <!-- قائمة الأجهزة -->
        <div class="devices">
            <h3>الأجهزة</h3>
            <div class="device" draggable="true" data-type="router">راوتر</div>
            <div class="device" draggable="true" data-type="switch">سويتش</div>
            <div class="device" draggable="true" data-type="pc">حاسب</div>
            <div class="device" draggable="true" data-type="firewall">جدار ناري</div>
        </div>

        <!-- لوحة الرسم -->
        <div class="canvas" id="canvas">
            اسحب الأجهزة هنا
        </div>

    </div>

    <button id="analyzeBtn">تحليل الأمان</button>

    <!-- نافذة النتائج -->
    <div id="results" class="results"></div>

    <script src="script.js"></script>
</body>
</html>
