<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>فحص المتاجر الإلكترونية</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1 class="title">فحص المتجر الإلكتروني</h1>

        <div class="input-box">
            <input type="text" id="urlInput" placeholder="مثال: https://store.com">
            <button id="scanBtn" onclick="startScan()">فحص</button>
        </div>

        <!-- شاشة التحميل -->
        <div id="loadingBox" class="loading-box">
            <div class="loader"></div>
            <p class="loading-text">جاري الفحص...</p>
        </div>

        <!-- النتيجة -->
        <div class="result-box" id="resultBox">
            <h2>نتيجة الفحص</h2>
            <div class="score" id="scoreValue">-- / 100</div>
            <div class="level" id="trustLevel"></div>
            <ul class="details" id="detailsList"></ul>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
