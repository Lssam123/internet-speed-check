<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>اختبار سرعة الإنترنت</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>اختبار سرعة الإنترنت</h1>
    
    <div class="meter">
      <div class="circle">
        <span id="download">--</span>
        <small>ميجابت/ثانية</small>
      </div>
      <p id="status">اضغط لبدء الاختبار</p>
    </div>

    <button onclick="ابدأ_الاختبار()">ابدأ الاختبار</button>

    <div class="results">
      <p>📤 سرعة الرفع: <span id="upload">--</span> ميجابت/ثانية</p>
    </div>

    <canvas id="الرسم_البياني"></canvas>

    <footer>
      <p>متدربين كلية العيدابي</p>
    </footer>

    <script src="script.js"></script>
  </div>
</body>
</html>
